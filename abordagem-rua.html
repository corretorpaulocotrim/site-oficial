<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2e36">
<title>Abordagem de Rua — Paulo Cotrim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--petroleo:#0f2e36;--verde:#0058A3;--gold:#0058A3;--ink:#08191e}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,system-ui,sans-serif;background:var(--ink);color:#eef4f2;min-height:100vh;line-height:1.5}
.frau{font-family:Fraunces,serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 40px;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.top svg{width:24px;height:24px}
.top b{font-family:Fraunces,serif;font-size:16px}
.top .creci{font-size:10px;font-weight:700;letter-spacing:.06em;color:#cfe0dc;border:1px solid rgba(255,255,255,.28);padding:3px 8px;border-radius:20px;margin-left:auto}
.bar{height:5px;background:rgba(255,255,255,.1);border-radius:3px;margin:14px 0 22px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--verde),var(--gold));transition:width .35s ease}
.step{flex:1;display:flex;flex-direction:column;justify-content:center}
.q{font-family:Fraunces,serif;font-size:26px;line-height:1.15;margin-bottom:6px}
.qs{color:#9fb3b0;font-size:14px;margin-bottom:22px}
.opts{display:grid;gap:11px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.chips{grid-template-columns:1fr 1fr}
.opt{background:linear-gradient(160deg,#12333c,#0c2229);border:1px solid rgba(255,255,255,.12);border-radius:15px;padding:18px 16px;font-size:16px;font-weight:600;color:#eef4f2;text-align:left;cursor:pointer;transition:transform .12s,border-color .2s}
.opt:active{transform:scale(.97)}
.opt:hover{border-color:var(--gold)}
.opt small{display:block;color:#9fb3b0;font-size:12px;font-weight:500;margin-top:2px}
input[type=text]{width:100%;background:#0f2e36;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:15px 14px;color:#fff;font-size:16px;margin-bottom:12px;font-family:inherit}
input:focus{outline:none;border-color:var(--verde)}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:#bcccc9;margin:6px 0 16px;text-align:left}
.consent input{margin-top:3px;width:18px;height:18px;flex:0 0 auto}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--verde);color:#fff;border:none;border-radius:15px;padding:17px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 12px 26px rgba(26,143,76,.35)}
.cta[disabled]{opacity:.4;box-shadow:none}
.cta.gold{background:var(--gold);box-shadow:0 12px 26px rgba(184,135,58,.35)}
.back{background:none;border:none;color:#9fb3b0;font-size:13px;margin-top:16px;cursor:pointer;font-family:inherit;align-self:center}
.qrs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
.qrcard{background:#fff;border-radius:16px;padding:14px;text-align:center}
.qrcard>div{display:flex;justify-content:center}
.qrcard b{display:block;color:var(--petroleo);font-size:13px;margin-top:8px}
.final-h{font-family:Fraunces,serif;font-size:24px;text-align:center;margin-bottom:2px}
.final-s{color:#9fb3b0;font-size:14px;text-align:center;margin-bottom:6px}
/* gate */
#lock{position:fixed;inset:0;z-index:1000;background:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px}
#lock .box{width:100%;max-width:320px;text-align:center}
#lock input{margin-bottom:10px}
</style>
</head>
<body>
<div id="lock"><div class="box">
  <svg viewBox="0 0 24 24" fill="none" stroke="#0058A3" stroke-width="2" style="width:38px;height:38px;margin:0 auto 12px"><circle cx="8" cy="8" r="4"/><path d="M11 11l8 8M16 16l3-3"/></svg>
  <div class="frau" style="font-size:20px;margin-bottom:16px">Abordagem de Rua</div>
  <input type="text" id="lu" placeholder="Usuário" autocomplete="username">
  <input type="password" id="lp" placeholder="Senha" autocomplete="current-password">
  <button class="cta" id="lb" type="button">Entrar</button>
  <div id="le" style="color:#e88;font-size:13px;margin-top:10px;min-height:16px"></div>
</div></div>

<div class="wrap">
  <div class="top">
    <svg viewBox="0 0 24 24" fill="none" stroke="#0058A3" stroke-width="2"><circle cx="8" cy="8" r="4"/><path d="M11 11l8 8M16 16l3-3"/></svg>
    <b>Paulo Cotrim</b><span class="creci">CRECI-RJ 77677-F</span>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div class="step" id="step"></div>
  <button class="back" id="back" style="display:none" type="button">← Voltar</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  // ---- login ----
  var lock=document.getElementById('lock');
  if(sessionStorage.getItem('pc_corretor_ok')==='1') lock.style.display='none';
  function log(){var u=document.getElementById('lu').value.trim(),p=document.getElementById('lp').value;
    if(u==='paulo'&&p==='102030'){sessionStorage.setItem('pc_corretor_ok','1');lock.style.display='none';}
    else document.getElementById('le').textContent='Usuário ou senha incorretos.';}
  document.getElementById('lb').addEventListener('click',log);
  document.getElementById('lp').addEventListener('keydown',function(e){if(e.key==='Enter')log();});

  // ---- regiões -> páginas SEO ----
  var REG=[
    ['Porto Maravilha','apartamentos-porto-maravilha.html','porto-maravilha'],
    ['Centro','apartamentos-centro-rj.html','centro'],
    ['Zona Norte','apartamentos-zona-norte-rj.html','zona-norte'],
    ['São Cristóvão','apartamentos-sao-cristovao-rj.html','sao-cristovao'],
    ['Niterói','apartamentos-niteroi.html','niteroi'],
    ['Jacarepaguá','apartamentos-jacarepagua-rj.html','jacarepagua'],
    ['São Gonçalo','apartamentos-sao-goncalo.html','sao-goncalo'],
    ['Campo Grande','apartamentos-campo-grande-rj.html','campo-grande']
  ];
  var A={}; // respostas
  var steps=[];

  steps.push(function(){ // 1 região
    return {q:'Onde você sonha em morar?', s:'Toque na sua região.', html:opts(REG.map(function(r){return {t:r[0],v:r[0],d:r[2]};}),'chips','regiao')};
  });
  steps.push(function(){ return {q:'É pra morar ou investir?', s:'', html:opts([{t:'Morar',v:'morar'},{t:'Investir',v:'investir'}],'two','obj')}; });
  steps.push(function(){ return {q:'Hoje você paga aluguel?', s:'', html:opts([{t:'Sim, pago aluguel',v:'aluguel'},{t:'Moro com a família',v:'familia'},{t:'Tenho imóvel',v:'proprio'}],'','aluguel')}; });
  steps.push(function(){ return {q:'Sua renda familiar fica em qual faixa?', s:'Só a faixa — não precisa do valor exato.', html:opts([
    {t:'Até R$ 2.640',v:'0-2640'},{t:'R$ 2.640 a 4.400',v:'2640-4400'},{t:'R$ 4.400 a 8.000',v:'4400-8000'},{t:'Acima de R$ 8.000',v:'8000+'}],'','renda')}; });
  steps.push(function(){ return {q:'Você tem FGTS ou tempo de carteira?', s:'Ajuda na entrada e no subsídio.', html:opts([{t:'Sim',v:'sim'},{t:'Não',v:'nao'},{t:'Não sei',v:'naosei'}],'','fgts')}; });
  steps.push(function(){ return {q:'Pensa em resolver isso quando?', s:'', html:opts([{t:'Agora / esse mês',v:'agora'},{t:'Em 3 a 6 meses',v:'3-6m'},{t:'Só pesquisando',v:'olhando'}],'','prazo')}; });
  steps.push(function(){ return {q:'Quanto você tem de entrada hoje?', s:'Pode ser aproximado — o FGTS também conta.', html:opts([{t:'Ainda não tenho',v:'0'},{t:'Até R$ 5 mil',v:'ate5'},{t:'R$ 5 a 20 mil',v:'5-20'},{t:'Mais de R$ 20 mil',v:'20+'}],'','entrada')}; });
  steps.push(function(){ return {q:'Quanto dá pra pagar por mês?', s:'Vale pra fase de obra e pra prestação pós-chaves.', html:opts([{t:'Até R$ 800',v:'0-800'},{t:'R$ 800 a 1.200',v:'800-1200'},{t:'R$ 1.200 a 2.000',v:'1200-2000'},{t:'Acima de R$ 2.000',v:'2000+'}],'','mensal')}; });
  steps.push(function(){ return {q:'Quer as chaves logo ou pode esperar a obra?', s:'', html:opts([{t:'Quero morar logo (pronto)',v:'pronto'},{t:'Posso esperar (planta/obra)',v:'obra'}],'','morar')}; });
  steps.push(function(){ // captura
    return {q:'Que ótimo! 👏', s:'Me passa seu contato que eu te mando as melhores opções da sua região no WhatsApp.', html:
      '<input type="text" id="cnome" placeholder="Seu nome" autocomplete="name">'+
      '<input type="text" id="cwa" placeholder="Seu WhatsApp (DDD + número)" inputmode="tel">'+
      '<label class="consent"><input type="checkbox" id="cok"><span>Autorizo o Paulo Cotrim (CRECI-RJ 77677-F) a me chamar no WhatsApp com opções de imóveis.</span></label>'+
      '<button class="cta" id="salvar" disabled>Concluir e gerar meus QR Codes</button>', cap:true};
  });

  var idx=0;
  var stepEl=document.getElementById('step'), prog=document.getElementById('prog'), back=document.getElementById('back');

  function opts(arr,cls,key){
    return '<div class="opts '+(cls||'')+'">'+arr.map(function(o){
      return '<button class="opt" data-k="'+key+'" data-v="'+o.v+'">'+o.t+(o.d?'<small>toque</small>':'')+'</button>';
    }).join('')+'</div>';
  }

  function render(){
    if(idx<steps.length){
      var st=steps[idx]();
      stepEl.innerHTML='<div class="q frau">'+st.q+'</div>'+(st.s?'<div class="qs">'+st.s+'</div>':'')+st.html;
      prog.style.width=Math.round(idx/(steps.length)*100)+'%';
      back.style.display=idx>0?'block':'none';
      if(!st.cap){
        Array.prototype.forEach.call(stepEl.querySelectorAll('.opt'),function(b){
          b.addEventListener('click',function(){ A[b.getAttribute('data-k')]=b.getAttribute('data-v'); next(); });
        });
      } else {
        var nome=document.getElementById('cnome'), wa=document.getElementById('cwa'), ok=document.getElementById('cok'), sv=document.getElementById('salvar');
        function chk(){ sv.disabled=!(nome.value.trim() && wa.value.replace(/\D/g,'').length>=10 && ok.checked); }
        nome.addEventListener('input',chk); wa.addEventListener('input',chk); ok.addEventListener('change',chk);
        sv.addEventListener('click',function(){ A.nome=nome.value.trim(); A.wa=wa.value.replace(/\D/g,''); salvarLead(); finalizar(); });
      }
    }
  }
  function next(){ idx++; render(); }
  back.addEventListener('click',function(){ if(idx>0){idx--; render();} });

  function temp(){ if(A.aluguel==='aluguel'&&A.prazo==='agora')return 'quente'; if(A.prazo==='olhando')return 'frio'; return 'morno'; }

  function salvarLead(){
    var lead={nome:A.nome,tel:A.wa,regiao:A.regiao||'',interesse:'Abordagem rua · '+(A.regiao||'')+' · '+(A.obj||''),
      orcamento:A.renda||'',origem:'abordagem-rua',status:'novo',temp:temp(),
      obs:'aluguel:'+(A.aluguel||'')+' fgts:'+(A.fgts||'')+' prazo:'+(A.prazo||'')+' entrada:'+(A.entrada||'')+' paga/mes:'+(A.mensal||'')+' morar:'+(A.morar||''),
      consentimento:new Date().toISOString(), ts:Date.now()};
    try{ var k='pc_leads_rua'; var arr=JSON.parse(localStorage.getItem(k)||'[]'); arr.push(lead); localStorage.setItem(k,JSON.stringify(arr)); }catch(e){}
    // tenta mandar pro CRM se a ponte existir
    try{ if(window.enviarLeadCRM) window.enviarLeadCRM(lead); }catch(e){}
  }

  function regInfo(){ for(var i=0;i<REG.length;i++) if(REG[i][0]===A.regiao) return REG[i]; return REG[1]; }

  function finalizar(){
    prog.style.width='100%'; back.style.display='none';
    var r=regInfo();
    var msg='Oi Paulo! Conversamos na rua sobre imóveis em '+ (A.regiao||'') +'. Meu nome é '+(A.nome||'')+'.';
    var waUrl='https://wa.me/5521989150864?text='+encodeURIComponent(msg);
    var pageUrl='https://paulocotrim.com.br/'+r[1]+'?utm_source=qr&utm_medium=rua&utm_content='+r[2];
    stepEl.innerHTML=
      '<div class="final-h">Prontinho, '+(A.nome? A.nome.split(' ')[0] : '')+'! 🔑</div>'+
      '<div class="final-s">Aponte a câmera do celular pra levar tudo com você.</div>'+
      '<div style="background:rgba(0,88,163,.14);border:1px solid rgba(0,88,163,.4);border-radius:12px;padding:12px 14px;font-size:13px;color:#dbe7e4;margin:6px 0 4px;text-align:center">Com sua renda, entrada e o quanto cabe por mês, o Paulo monta a <b>simulação real</b> (fase de obra + prestação pós-chaves) e te mostra o <b>condomínio mais compatível</b>.</div>'+
      '<div class="qrs"><div class="qrcard"><div id="qr1"></div><b>Falar com o Paulo</b></div>'+
      '<div class="qrcard"><div id="qr2"></div><b>Imóveis em '+(A.regiao||'sua região')+'</b></div></div>'+
      '<a class="cta gold" href="'+waUrl+'" style="text-decoration:none;margin-bottom:10px">Abrir meu WhatsApp agora</a>'+
      '<button class="back" id="novo" type="button" style="margin-top:6px">Nova abordagem</button>';
    try{ new QRCode(document.getElementById('qr1'),{text:waUrl,width:130,height:130,colorDark:'#0f2e36'});
         new QRCode(document.getElementById('qr2'),{text:pageUrl,width:130,height:130,colorDark:'#0f2e36'}); }catch(e){}
    document.getElementById('novo').addEventListener('click',function(){ A={}; idx=0; render(); });
  }

  render();
})();
</script>
</body>
</html>
