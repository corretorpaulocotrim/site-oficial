<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imóveis por região · Paulo Cotrim</title>
<meta name="description" content="Imóveis novos no Rio de Janeiro por região, com curadoria de Paulo Cotrim · CRECI-RJ 77677-F.">
<link rel="icon" href="favicon.ico">
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.6 Inter,Segoe UI,Arial,sans-serif;background:#f4efe6;color:#0f2e36}
.rx-top{position:sticky;top:0;z-index:5;background:#050b0c;border-bottom:1px solid rgba(230,197,129,.25)}
.rx-top .rx-w{display:flex;align-items:center;gap:14px;padding-top:10px;padding-bottom:10px}.rx-top .lg{font:italic 600 18px Fraunces,Georgia,serif;color:#e6c581;text-decoration:none;flex:none}
#rx-tabs{display:flex;gap:6px;overflow:auto}#rx-tabs a{flex:none;color:#d9d3c7;text-decoration:none;font:600 12.5px Inter,Arial;padding:7px 12px;border-radius:20px;border:1px solid transparent}#rx-tabs a.on{color:#e6c581;border-color:rgba(230,197,129,.5)}
.rx-w{max-width:1180px;margin:0 auto;padding:0 16px}
.rx-h{background:radial-gradient(120% 90% at 85% 0%,#163c45,#0f2e36 45%,#050b0c);color:#f4efe6;padding:28px 0 46px}
.rx-v{display:inline-block;color:#cfd6d4;text-decoration:none;font-size:13px;margin-bottom:22px}
.rg-eye{display:block;font:600 11px Inter,Arial;letter-spacing:.32em;text-transform:uppercase;color:#cf9f4f;margin-bottom:8px}
.rx-h h1{font:italic 600 clamp(40px,7vw,68px)/1 Fraunces,Georgia,serif;color:#e6c581;margin:0}.rx-s{color:#cfd6d4;margin:6px 0 22px}
.rx-h h2{font:600 clamp(22px,3.4vw,30px)/1.2 Fraunces,Georgia,serif;color:#f4efe6;margin:0 0 8px;max-width:720px}.rx-h p{color:#d9d3c7;max-width:680px}
.rx-h ul{list-style:none;padding:0;margin:16px 0;display:grid;grid-template-columns:1fr;gap:8px;max-width:760px}.rx-h li{padding-left:22px;position:relative;color:#ece6da}.rx-h li:before{content:"";position:absolute;left:4px;top:9px;width:8px;height:8px;border-radius:50%;background:#cf9f4f}
.rx-k{display:flex;gap:10px;margin:18px 0;max-width:520px}.rx-k div{flex:1;border:1px solid rgba(230,197,129,.4);border-radius:14px;padding:12px 14px}.rx-k b{display:block;font:600 26px Fraunces,Georgia,serif;color:#e6c581}.rx-k small{color:#cfd6d4}
.rx-ct{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.rx-b,.rx-b2{display:inline-block;border-radius:30px;padding:14px 24px;font:700 14px Inter,Arial;text-decoration:none}
.rx-b{background:#e6c581;color:#0f2e36}.rx-b2{border:1px solid rgba(230,197,129,.6);color:#e6c581}
section.rx-w h3{font:italic 600 30px Fraunces,Georgia,serif;margin:36px 0 14px}
.rx-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:56px}
.rx-c{display:block;background:#fff;border:1px solid #e3d9c6;border-radius:16px;overflow:hidden;text-decoration:none;color:#0f2e36;transition:transform .25s,box-shadow .25s}.rx-c:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(15,46,54,.16)}
.rx-c span{display:block;aspect-ratio:16/10;background:#0b2228 center/cover}.rx-c b{display:block;font:600 18px Fraunces,Georgia,serif;padding:12px 14px 0}.rx-c small{display:block;color:#6b7774;padding:0 14px}.rx-c em{display:block;font-style:normal;color:#8a6a2f;font-weight:700;padding:6px 14px 14px}
@media(min-width:760px){.rx-h ul{grid-template-columns:1fr 1fr}}
</style></head><body>
<nav class="rx-top"><div class="rx-w"><a class="lg" href="index.html">Paulo Cotrim</a><div id="rx-tabs"></div></div></nav>
<main id="pc-regiao"></main>
<script src="regioes.js"></script>
<script src="leads.js" defer></script>
</body></html>
