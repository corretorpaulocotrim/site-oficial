<script>/* ===== CONTEÚDO DO APP: treinamento, glossário, gatilhos, perfis, scripts, quiz ===== */

function cpBlock(id, txt, rows) { return `<textarea class="ta" id="${id}" rows="${rows || 3}">${esc(txt)}</textarea><button class="btn small" onclick="copyT('${id}')">Copiar</button>`; }
function sResp() {
  const q = (V.rq || '').toLowerCase(), r = RESP.map((x, i) => [x, i]).filter(([x]) => !q || (x[0] + x[1]).toLowerCase().includes(q));
  return `<div class="card hero2"><h2>Respostas rápidas</h2><p class="mut">${RESP.length} objeções e pedidos comuns por telefone e WhatsApp. Ajuste ao seu jeito antes de enviar.</p></div>
<input class="search" type="search" placeholder="Buscar (tabela, preço, depois...)" value="${esc(V.rq || '')}" oninput="V.rq=this.value;keep();render();const i=$('.search');i.focus();i.setSelectionRange(V.rq.length,V.rq.length)">
${r.map(([x, i]) => `<div class="card"><h3>"${esc(x[0])}"</h3>${cpBlock('rp' + i, telFill(x[1]), 4)}<div class="gold-box">${esc(x[2])}</div></div>`).join('') || '<p class="mut">Nenhuma resposta encontrada.</p>'}`;
}
function sCad() {
  return `<div class="card hero2"><h2>Cadência de 30 dias</h2><p class="mut">Sequência de contatos para quem não respondeu. Pare se o cliente pedir. Máximo respeitoso, sem insistir.</p></div>` +
    CADENCIA.map((c, i) => `<div class="card"><div class="between"><h3>${c.d}</h3><span class="pill">${esc(c.c)}</span></div><p class="mut small">${esc(c.o)}</p>${c.s ? cpBlock('cd' + i, telFill(c.s), 3) : ''}</div>`).join('');
}
function sTipos() {
  return `<div class="card hero2"><h2>Tipos de lead</h2><p class="mut">Cada origem pede uma abertura diferente. O app escolhe sozinho ao abrir um lead.</p></div>` +
    TIPOS.map((x, i) => `<div class="card"><h3>${esc(x.nome)}</h3><p class="mut small">${esc(x.quando)}</p><h4>Ligação</h4>${cpBlock('tpl' + i, telFill(x.lig), 3)}<h4>WhatsApp</h4>${cpBlock('tpz' + i, telFill(x.zap), 3)}<div class="gold-box">${esc(x.nota)}</div></div>`).join('');
}
function sVoz() {
  const ul = a => `<ul class="ul">${a.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  return `<div class="card hero2"><h2>Voz, WhatsApp e regras</h2><p class="mut">O que muda o resultado antes mesmo do conteúdo.</p></div>
<div class="card"><h3>Na ligação</h3>${ul(VOZ.ligacao)}</div><div class="card"><h3>No WhatsApp</h3>${ul(VOZ.zap)}</div>
<div class="card"><h3>8 perguntas de qualificação</h3>${ul(QUALIF)}</div>
<h2 class="mt">Áudios</h2>${AUDIOS.map((a, i) => `<div class="card"><h3>${esc(a.t)}</h3>${cpBlock('au' + i, telFill(a.s), 4)}</div>`).join('')}
<div class="card"><h3>Caixa postal</h3>${cpBlock('cp0', telFill(CAIXA_POSTAL), 3)}</div>
<div class="note bad"><h3>Conformidade</h3>${ul(VOZ.compliance)}<p class="small">Confirme as regras vigentes do WhatsApp e da LGPD; este texto não é parecer jurídico.</p></div>`;

    { l: 'Intermediárias', pct: g('intPct'), cnt: Math.max(1, g('nInt')), mid: true, c: '#b8873a' },
    { l: 'Chaves', pct: g('chavesPct'), cnt: 1, ts: [M], c: '#d9b877' }
  ];

<button class="tile" onclick="go('atender')">${IC.a}<b>Atender um cliente</b><span>Abra a ficha do empreendimento: endereço, negociação, valor e produto.</span></button>

<div class="card"><div class="between"><h3 style="margin:0">Seu progresso</h3><span class="mut small">${pr.p}% do curso · quiz ${S.quiz.best || 0}/${QUIZ.length}</span></div><div class="bar" style="margin-bottom:0"><i style="width:${pr.p}%"></i></div></div>
<details><summary><span class="tt">Antes da reunião</span><small class="mut">${ck}/${CHECKLIST.length}</small></summary><div class="b">
${CHECKLIST.map((c, i) => `<label class="chk"><input type="checkbox" ${S.checks[i] ? 'checked' : ''} onchange="S.checks[${i}]=this.checked;save();keep();render()"><span>${esc(c)}</span></label>`).join('')}
<button class="link" onclick="S.checks={};save();keep();render()">Limpar checklist</button></div></details>

${low.map(([e, p]) => `<div class="li" onclick="openEmp('${e.id}')"><div><b>${esc(e.nome || 'Sem nome')}</b><div class="mut small">${esc(e.construtora || '')}</div></div><div class="pill ${p < 50 ? 'warn' : ''}">${p}%</div></div>`).join('')}</div></details>`;

/* ---------- ATENDER ---------- */
const PF = [['all', 'Todos'], ['uhnw', 'Altíssimo padrão'], ['inv', 'Investidor'], ['moradia', 'Moradia'], ['prim', 'Primeira aquisição']];
function ph(e) { return e.foto ? `<img src="${e.foto}" alt="${esc(e.nome)}">` : `<div class="ph"><span>PC</span></div>`; }
function vAtender() {
  if (V.cur) { const e = E(V.cur); if (e) return V.edit ? vForm(e) : vEmp(e); }
  const q = V.q.toLowerCase();
  const f = e => (V.filt === 'all' || e.perfis.includes(V.filt)) && (!q || [e.nome, e.bairro, e.construtora].join(' ').toLowerCase().includes(q));
  const main = S.emps.filter(e => !e.grupo && f(e)), gr = S.emps.filter(e => e.grupo && f(e));
  return `<div class="between"><h2>Empreendimentos</h2><button class="btn small" onclick="newEmp()">+ Novo</button></div>
<input class="search" type="search" placeholder="Buscar por nome, bairro ou construtora" value="${esc(V.q)}" oninput="V.q=this.value;keep();renderList()">
<div class="chips">${PF.map(([k, l]) => `<button class="${V.filt === k ? 'on' : ''}" onclick="V.filt='${k}';render()">${l}</button>`).join('')}</div>
<div class="grid" id="lst">${main.map(cardE).join('') || '<p class="mut">Nenhum empreendimento.</p>'}</div>
<h3 class="mt">Comparativo</h3>${cmp(S.emps.filter(e => !e.grupo && f(e)))}
<h3 class="mt">Carteira Sawala por região</h3><div class="grid">${gr.map(cardE).join('')}</div>`;
}
function cmp(list) {
  const rows = list.filter(e => num(e.precoDe)).map(e => { const p = num(e.precoDe), m = num(e.metragemMin), al = num(e.aluguelEst); return { e, p, m, pm: m ? p / m : 0, y: al ? al * 12 / p * 100 : 0 }; }).sort((x, y) => (x.pm || 1e12) - (y.pm || 1e12));
  if (!rows.length) return '<p class="mut small">Cadastre o preço dos empreendimentos para comparar.</p>';
  return `<div class="card scroll"><table class="t"><tr><th>Empreendimento</th><th>Bairro</th><th>A partir de</th><th>m² mín.</th><th>R$/m²</th><th>Yield bruto</th><th>Entrega</th></tr>${rows.map(r => `<tr onclick="openEmp('${r.e.id}')" style="cursor:pointer"><td><b>${esc(r.e.nome)}</b></td><td>${esc(r.e.bairro)}</td><td>${fmtR(r.p)}</td><td>${r.m ? String(r.m).replace('.', ',') : '—'}</td><td>${r.pm ? fmtR(r.pm) : '—'}</td><td>${r.y ? fmtP(r.y) : '—'}</td><td>${r.e.entrega ? esc(r.e.entrega.split('-').reverse().join('/')) : '—'}</td></tr>`).join('')}</table><p class="disc">Ordenado do menor para o maior R$/m². O preço "a partir de" é o da menor unidade, então o R$/m² é indicativo. Dados de portais e da sua base: confirme a tabela atual.</p></div>`;
}
function renderList() { const y = scrollY; render(); scrollTo(0, y); const i = $('.search'); if (i) { i.focus(); i.setSelectionRange(V.q.length, V.q.length); } }
function cardE(e) {
  const c = completeness(e), pm = num(e.precoDe), m = num(e.metragemMin);
  return `<div class="card emp" onclick="openEmp('${e.id}')"><div class="thumb">${ph(e)}</div><div class="pad"><div class="between"><b>${esc(e.nome || 'Sem nome')}</b><span class="pill ${c < 50 ? 'warn' : ''}">${c}%</span></div>
<div class="mut small">${esc([e.bairro, e.construtora].filter(Boolean).join(' · '))}</div>
${pm ? `<div class="small mt-s">A partir de <b>${fmtR(pm)}</b>${m ? ` · ${fmtR(pm / m)}/m²` : ''}</div>` : ''}</div></div>`;
}
function openEmp(id) { V.tab = 'atender'; V.cur = id; V.edit = false; render(); scrollTo(0, 0); }
function newEmp() { const e = mk({ nome: 'Novo empreendimento' }); S.emps.unshift(e); save(); V.cur = e.id; V.edit = true; render(); scrollTo(0, 0); }
function dupEmp(id) { const o = E(id), e = JSON.parse(JSON.stringify(o)); e.id = uid(); e.nome = o.nome + ' (cópia)'; e.foto = ''; S.emps.unshift(e); save(); V.cur = e.id; V.edit = true; render(); toast('Cópia criada'); }
function delEmp(id) { if (!confirm('Excluir este empreendimento?')) return; S.emps = S.emps.filter(e => e.id !== id); save(); V.cur = null; V.edit = false; render(); }
function mapUrl(e) { return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(e.endereco || (e.nome + ' ' + e.bairro + ' Rio de Janeiro')); }

function simBlock(e) {
  const rows = S.scen.map(s => ({ s, r: sim(e, s.incc, s.val) }));
  const r0 = rows[1].r;
  if (!r0.P) return `<div class="note">Informe o preço de referência (ou "A partir de") na ficha para simular.</div>`;
  if (!r0.filled) return `<div class="note">Cadastre a estrutura de negociação da construtora (ato, entrada, mensais, intermediárias, chaves) para ver o fluxo e os cenários.<br><button class="btn small mt-s" onclick="V.edit=true;render()">Cadastrar negociação</button></div>`;
  const tot = r0.sumPct + Math.max(0, r0.finPct);
  const seg = r0.parts.concat([{ l: 'Financiamento / saldo', pct: Math.max(0, r0.finPct), c: '#c9ced3' }]).filter(p => p.pct > 0)
    .map(p => `<i style="width:${p.pct / tot * 100}%;background:${p.c}" title="${esc(p.l)} ${fmtP(p.pct)}"></i>`).join('');
  const leg = r0.parts.concat([{ l: 'Financiamento / saldo', pct: Math.max(0, r0.finPct), val: r0.finNom, c: '#c9ced3', cnt: 1 }]).filter(p => p.pct > 0)
    .map(p => `<div class="k"><span><i class="dot" style="background:${p.c}"></i>${p.l}</span><span>${fmtP(p.pct)} · ${fmtR(p.val)}${p.cnt > 1 ? `<br><small class="mut">${p.cnt}x de ${fmtR(p.val / p.cnt)}</small>` : ''}</span></div>`).join('');
  const warn = (r0.finPct < 0 ? '<div class="note bad">As porcentagens somam mais de 100%. Revise a negociação.</div>' : '') + (r0.overMens ? '<div class="note">O número de mensais é maior que os meses até a entrega. Confira a tabela.</div>' : '') + (!e.entrega ? '<div class="note">Informe o mês de entrega para calcular a correção e a valorização.</div>' : '');
  const colH = rows.map((x, i) => `<th><input class="mini" value="${esc(x.s.n)}" onchange="S.scen[${i}].n=this.value;save()"></th>`).join('');
  const inp = (k, lbl) => `<tr><td>${lbl}</td>${rows.map((x, i) => `<td><input class="mini num" inputmode="decimal" value="${x.s[k]}" onchange="S.scen[${i}].${k}=num(this.value);save();keep();render()"></td>`).join('')}</tr>`;
  const out = (lbl, fn) => `<tr><td>${lbl}</td>${rows.map(x => `<td><b>${fn(x.r)}</b></td>`).join('')}</tr>`;
  return `${warn}<div class="seg">${seg}</div>${leg}
<div class="k"><span>Meses até a entrega</span><span>${r0.M}</span></div>
<div class="k"><span>Desembolso médio mensal na obra (cenário base, corrigido)</span><span>${fmtR(r0.mensalObra)}</span></div>
<h4 class="mt">Cenários (premissas editáveis)</h4>
<div class="scroll"><table class="t"><tr><th></th>${colH}</tr>${inp('incc', 'INCC ao ano (%)')}${inp('val', 'Valorização ao ano (%)')}
${out('Pago até as chaves (corrigido)', r => fmtR(r.cor))}${out('Saldo corrigido nas chaves', r => fmtR(r.finCor))}${out('Custo total corrigido', r => fmtR(r.totalCor))}
${out('Valor estimado na entrega', r => fmtR(r.Vk))}${out('Diferença (valor − custo corrigido)', r => fmtR(r.ganho))}
${out('Sobre o capital pago até as chaves', r => r.roiCap == null ? '—' : fmtP(r.roiCap, 0))}</table></div>
${num(e.aluguelEst) ? `<div class="k"><span>Yield bruto / líquido (aluguel ${fmtR(num(e.aluguelEst))}, custos ${num(e.custosPct)}%)</span><span>${fmtP(r0.yb)} / ${fmtP(r0.yl)}</span></div><div class="k"><span>Renda líquida mensal estimada</span><span>${fmtR(r0.rendaMes)}</span></div><div class="k"><span>Payback só com aluguel</span><span>${r0.payback ? r0.payback.toFixed(0) + ' anos' : '—'}</span></div>` : '<div class="note">Informe o aluguel estimado para calcular o yield.</div>'}
<p class="disc">Simulação ilustrativa. Parcelas corrigidas por INCC até as chaves e saldo corrigido no mesmo índice (simplificação). Não considera juros do financiamento, impostos, corretagem nem custos de venda. Valorização e aluguel são premissas, não garantias.</p>`;
}

function vEmp(e) {
  const pf = PERFIS[V.perfil], dif = lines(e.diferenciais), pm = num(e.precoDe), m = num(e.metragemMin);
  const mz = ZONAS.find(z => e.bairro && z.b.toLowerCase() === e.bairro.toLowerCase()), r0 = sim(e, S.scen[1].incc, S.scen[1].val);
  const sumTxt = r0.filled ? [['Ato', 'atoPct'], ['Entrada compl.', 'entCompPct'], ['Mensais', 'mensaisPct'], ['Intermed.', 'intPct'], ['Chaves', 'chavesPct']].filter(([, k]) => num(e.negoc[k]) > 0).map(([l, k]) => `${l} ${fmtP(num(e.negoc[k]), 0)}`).join(' · ') + (r0.finPct > 0 ? ` · Financ. ${fmtP(r0.finPct, 0)}` : '') : '';
  return `<button class="link int" onclick="V.cur=null;render()">← Empreendimentos</button>
<section class="cover"><div class="img">${ph(e)}</div><div class="cap"><small class="kicker">${esc([e.bairro, e.estagio].filter(Boolean).join(' · '))}</small><h1>${esc(e.nome)}</h1><p>${esc(e.construtora)}</p></div></section>
<div class="row int"><button class="btn small" onclick="V.edit=true;render()">Editar</button><button class="btn small ghost-d" onclick="printEmp()">Ficha para o cliente</button><a class="btn small ghost-d" target="_blank" rel="noopener" href="${mapUrl(e)}">Abrir mapa</a><button class="btn small ghost-d" onclick="dupEmp('${e.id}')">Duplicar como molde</button></div>
${e.alerta ? `<div class="note bad int"><b>Confirmar antes de apresentar:</b> ${esc(e.alerta)}</div>` : ''}
<h2 class="mt">Os 5 diferenciais</h2>
<div class="dif">
<div class="card d1"><small class="kicker">1 · Endereço</small><b>${esc(e.endereco || 'Preencher endereço')}</b>${e.tipologia ? `<p class="mut small">${esc(e.tipologia)}</p>` : ''}<a class="link" target="_blank" rel="noopener" href="${mapUrl(e)}">Ver no mapa</a></div>
<div class="card d2"><small class="kicker">2 · Imagem</small><p class="mut small">${e.foto ? 'Foto cadastrada, exibida na capa.' : 'Sem foto. Adicione na ficha (Editar).'}</p></div>
<div class="card d3 main"><small class="kicker">3 · Negociação (principal)</small><b>${sumTxt ? esc(sumTxt) : 'Cadastrar a estrutura da construtora'}</b>${e.negoc.validade ? `<p class="mut small">Tabela válida até/ref.: ${esc(e.negoc.validade)}</p>` : ''}${e.negoc.obs ? `<p class="small">${esc(e.negoc.obs)}</p>` : ''}</div>
<div class="card d4"><small class="kicker">4 · Valor e rentabilidade</small><b>${pm ? 'A partir de ' + fmtR(pm) : 'Informar preço'}</b>${pm && m ? `<p class="small">${fmtR(pm / m)}/m²${mz && (mz.j || mz.m) ? ` · bairro (FipeZAP ${mz.j ? 'jan/2026' : 'base'}): ${fmtR(mz.j || mz.m)}/m²` : ''}</p>` : ''}${r0.P && num(e.aluguelEst) ? `<p class="small">Yield bruto ${fmtP(r0.yb)} · líquido ${fmtP(r0.yl)}</p>` : ''}</div>
<div class="card d5"><small class="kicker">5 · Produto</small>${dif.length ? '<ul class="ul">' + dif.map(x => `<li>${esc(x)}</li>`).join('') + '</ul>' : '<p class="mut small">Liste os diferenciais na ficha.</p>'}${e.entrega ? `<p class="small">Entrega: ${esc(e.entrega.split('-').reverse().join('/'))}</p>` : ''}</div>
</div>
${e.tabelas && e.tabelas.length ? `<h2 class="mt">Tabelas da construtora</h2>${e.tabelas.map(t => `<div class="card"><h3>${esc(t.t)}</h3><div class="scroll"><table class="t"><tr>${t.c.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${t.r.map(r => `<tr>${r.map(x => `<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table></div></div>`).join('')}<div class="note">${esc(e.tabNota || '')}</div>` : ''}
<h2 class="mt">Negociação e simulador</h2><div class="card">${simBlock(e)}</div>
${e.entorno ? `<h2 class="mt">Entorno e tese</h2><div class="card"><p>${esc(e.entorno).replace(/\n/g, '<br>')}</p></div>` : ''}
${e.historico ? `<h3>Incorporadora e histórico</h3><div class="card"><p>${esc(e.historico).replace(/\n/g, '<br>')}</p></div>` : ''}
<div class="int"><h2 class="mt">Conduzir com este cliente</h2>
<div class="chips">${Object.entries(PERFIS).map(([k, p]) => `<button class="${V.perfil === k ? 'on' : ''}" onclick="V.perfil='${k}';keep();render()">${p.nome.split(' (')[0].split(' /')[0]}</button>`).join('')}</div>
<div class="card"><h3>${esc(pf.nome)}</h3><p class="mut">${esc(pf.tom)}</p>
<h4>Abertura</h4><p>"${esc(pf.abrir)}"</p><h4>Perguntas</h4><ul class="ul">${pf.perguntas.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
<h4>Gatilhos éticos</h4><ul class="ul">${pf.gatilhos.map(x => `<li>${esc(x)}</li>`).join('')}</ul><div class="note"><b>Evite:</b> ${esc(pf.evitar)}</div></div>
<h3>Resumo para enviar</h3><div class="card"><textarea id="wtxt" class="ta" rows="7">${esc(resumo(e))}</textarea><div class="row"><button class="btn small" onclick="copyT('wtxt')">Copiar</button><a class="btn small ghost-d" target="_blank" rel="noopener" id="wlnk" onclick="this.href='https://wa.me/?text='+encodeURIComponent($('#wtxt').value)">Abrir no WhatsApp</a></div></div>
<h3>Notas da reunião</h3><div class="card"><textarea class="ta" rows="5" placeholder="Objetivo do cliente, objeções, próximos passos, data de retorno" onchange="E('${e.id}').notas=this.value;save();toast('Notas salvas')">${esc(e.notas)}</textarea></div></div>`;
}
function resumo(e) {
  const r = sim(e, S.scen[1].incc, S.scen[1].val), pm = num(e.precoDe), m = num(e.metragemMin);
  return [`${e.nome}${e.bairro ? ', ' + e.bairro : ''}`, e.endereco, e.construtora ? 'Incorporadora: ' + e.construtora : '', pm ? `A partir de ${fmtR(pm)}${m ? ` (${fmtR(pm / m)}/m²)` : ''}` : '', e.entrega ? 'Entrega prevista: ' + e.entrega.split('-').reverse().join('/') : '',
    r.filled ? 'Negociação: ' + r.parts.filter(p => p.pct > 0).map(p => `${p.l.toLowerCase()} ${fmtP(p.pct, 0)}`).join(', ') + (r.finPct > 0 ? `, financiamento/saldo ${fmtP(r.finPct, 0)}` : '') : '',
    r.P && num(e.aluguelEst) ? `Rentabilidade estimada: ${fmtP(r.yl)} líquido ao ano (premissas: aluguel ${fmtR(num(e.aluguelEst))}/mês, custos ${num(e.custosPct)}%).` : '',
    'Valores e rentabilidade são estimativas, sujeitas a confirmação de tabela, disponibilidade e condições de mercado.'].filter(Boolean).join('\n');
}
function copyT(id) { const t = $('#' + id); t.select(); try { navigator.clipboard.writeText(t.value); } catch (e) { document.execCommand('copy'); } toast('Copiado'); }
function printEmp() { document.body.classList.add('printing'); setTimeout(() => { print(); }, 100); }
addEventListener('afterprint', () => document.body.classList.remove('printing'));

/* ---------- FORMULÁRIO ---------- */
function setF(id, path, v) { const e = E(id), p = path.split('.'); let o = e; while (p.length > 1) o = o[p.shift()]; o[p[0]] = v; save(); }
function togP(id, k) { const e = E(id); e.perfis = e.perfis.includes(k) ? e.perfis.filter(x => x !== k) : e.perfis.concat(k); save(); keep(); render(); }
function fld(e, path, l, o = {}) {
  const v = path.split('.').reduce((a, k) => a[k], e);
  const ph = o.ph ? ` placeholder="${esc(o.ph)}"` : '';
  const inp = o.ta ? `<textarea class="ta" rows="${o.ta}"${ph} onchange="setF('${e.id}','${path}',this.value)">${esc(v)}</textarea>` : `<input ${o.t === 'month' ? 'type="month"' : 'type="text"'} ${o.n ? 'inputmode="decimal"' : ''}${ph} value="${esc(v)}" onchange="setF('${e.id}','${path}',this.value);keep();render()">`;
  return `<label class="f"><span>${l}</span>${inp}</label>`;
}
function vForm(e) {
  const c = completeness(e);
  return `<div class="between"><button class="link" onclick="V.edit=false;render()">← Voltar à ficha</button><span class="pill ${c < 50 ? 'warn' : ''}">${c}% completa</span></div>
<h2>Ficha do empreendimento</h2>
<div class="card"><h3>Identificação</h3>${fld(e, 'nome', 'Nome')}${fld(e, 'construtora', 'Construtora / incorporadora')}${fld(e, 'bairro', 'Bairro')}${fld(e, 'endereco', 'Endereço completo')}${fld(e, 'tipologia', 'Tipologias')}
<label class="f"><span>Estágio</span><select onchange="setF('${e.id}','estagio',this.value)">${['', 'Lançamento', 'Em obras', 'Pronto'].map(x => `<option ${e.estagio === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
${fld(e, 'entrega', 'Entrega prevista', { t: 'month' })}
<div class="f"><span>Perfis de cliente</span><div class="chips">${PF.slice(1).map(([k, l]) => `<button type="button" class="${e.perfis.includes(k) ? 'on' : ''}" onclick="togP('${e.id}','${k}')">${l}</button>`).join('')}</div></div></div>
<div class="card"><h3>Foto</h3>${e.foto ? `<div class="thumb big">${ph(e)}</div>` : ''}<input type="file" accept="image/*" onchange="upFoto('${e.id}',this)">${e.foto ? `<button class="link" onclick="setF('${e.id}','foto','');keep();render()">Remover foto</button>` : ''}</div>
<div class="card"><h3>Valores</h3>${fld(e, 'metragemMin', 'Metragem mínima (m²)', { n: 1 })}${fld(e, 'metragemMax', 'Metragem máxima (m²)', { n: 1 })}${fld(e, 'precoDe', 'Preço a partir de (R$)', { n: 1, ph: '399000' })}${fld(e, 'aluguelEst', 'Aluguel mensal estimado (R$)', { n: 1 })}${fld(e, 'custosPct', 'Custos sobre o aluguel (%)', { n: 1 })}</div>
<div class="card"><h3>Negociação da construtora</h3><p class="mut small">Preencha em % do preço. O financiamento/saldo é calculado automaticamente pelo que sobra.</p>
${fld(e, 'negoc.precoRef', 'Preço da unidade simulada (R$, opcional)', { n: 1 })}${fld(e, 'negoc.atoPct', 'Ato / sinal (%)', { n: 1 })}${fld(e, 'negoc.entCompPct', 'Entrada complementar (%)', { n: 1 })}${fld(e, 'negoc.nEnt', 'Nº de parcelas da entrada complementar', { n: 1 })}

/* ---- Integração com o site: acrescenta ao Treinador os condomínios do catálogo do site (sem sobrescrever o que você já preencheu) ---- */
(function(){
  const norm = x => String(x || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
  const root = /\/treinador\//.test(location.pathname) ? '../' : '';
  Promise.all([fetch(root + 'data/catalogo.json').then(r => r.json()), fetch(root + 'data/sawala-principais.json').then(r => r.json())]).then(([cat, pr]) => {
    const det = {}; ['destaques', 'semestre', 'embreve'].forEach(k => (pr[k] || []).forEach(x => det[x.id] = x));
    const have = S.emps.map(e => norm(e.nome));
    let add = 0;
    (cat.itens || []).forEach(c => {
      const id = 'site-' + (c.sid || norm(c.nome).replace(/ /g, '-'));
      if (S.emps.some(e => e.id === id)) return;
      const n = norm(c.nome); if (!n) return;
      if (have.some(h => h && (h === n || h.includes(n) || n.includes(h)))) return;
      const d = det[c.sid] || {}; const nums = String(c.plantas || d.area || '').match(/\d+(?:,\d+)?/g) || [];
      const dif = [d.descricao, d.vagas && 'Vagas: ' + d.vagas, d.quartos && 'Quartos: ' + d.quartos].filter(Boolean).join('\n');
      const e = mk({ id, nome: c.nome, construtora: c.incorporadora || '', bairro: c.local || c.regiao || '', endereco: [d.endereco, d.cidade].filter(Boolean).join(', '), tipologia: c.plantas || d.quartos || '', estagio: c.status || '', entrega: d.entrega || '', perfis: /Ipanema|Leblon|Copacabana|Botafogo|Laranjeiras|Gávea|Lagoa|Arpoador|Zona Sul/i.test((c.local || '') + (c.regiao || '')) ? ['uhnw', 'inv'] : ['inv'],
        metragemMin: nums[0] || '', metragemMax: nums.length > 1 ? nums[nums.length - 1].replace(/\s/g, '') : '', diferenciais: dif, foto: c.img ? '/' + c.img : '', fonte: 'Site paulocotrim.com (catálogo Sawala). Preço e tabela: preencher quando a construtora confirmar.', alerta: c.preco ? '' : 'Preço: Consulte. Sem tabela confirmada no site.' });
      S.emps.push(e); have.push(n); add++;
    });
    if (add) { save(); render(); toast(add + ' condomínios do site adicionados ao Treinador'); }
  }).catch(() => {});
})();
